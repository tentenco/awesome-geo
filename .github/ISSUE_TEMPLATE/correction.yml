name: Report a correction
description: Report a broken link, stale claim, missing caveat, or classification error.
title: "[Correction]: "
labels:
  - correction
body:
  - type: input
    id: location
    attributes:
      label: File or URL
      placeholder: README.md, docs/tools.md, or a linked URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or outdated?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting source or proposed correction
      description: Prefer an original or official source.
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Date checked
      placeholder: YYYY-MM-DD
    validations:
      required: true

